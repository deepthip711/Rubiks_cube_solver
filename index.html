<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rubik's Cube Visual Solver</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 20px;
      background: #f5f5f5;
      color: #333;
    }

    h1 {
      margin-bottom: 20px;
      color: #222;
    }

    .buttons {
      margin-bottom: 20px;
    }

    button {
      margin: 5px;
      padding: 10px 18px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      background: #4CAF50;
      color: white;
    }

    button:hover {
      background: #45a049;
      transform: scale(1.05);
    }

    #status {
      margin: 15px;
      font-weight: bold;
      font-size: 16px;
    }

    .cube-net {
      display: grid;
      grid-template-columns: repeat(4, auto);
      grid-template-rows: repeat(3, auto);
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .face {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 3px;
      background: #222;
      padding: 5px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 5px;
      border: 1px solid #111;
      transition: background 0.3s;
    }

    .label {
      text-align: center;
      margin-top: 5px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Rubik's Cube Visual Solver</h1>

  <!-- Buttons for scrambling, solving, and manual rotation -->
  <div class="buttons">
    <button onclick="scrambleCube()">Scramble</button>
    <button onclick="solveCube()">Solve Step-by-Step</button>
    <button onclick="rotate('U')">Rotate Up (U)</button>
    <button onclick="rotate('D')">Rotate Down (D)</button>
    <button onclick="rotate('F')">Rotate Front (F)</button>
    <button onclick="rotate('B')">Rotate Back (B)</button>
    <button onclick="rotate('L')">Rotate Left (L)</button>
    <button onclick="rotate('R')">Rotate Right (R)</button>
  </div>

  <!-- Status messages -->
  <div id="status">Status: Ready</div>

  <!-- Cube layout in 2D net -->
  <div class="cube-net">
    <div></div>
    <div>
      <div class="face" id="U"></div>
      <div class="label">Up</div>
    </div>
    <div></div>
    <div></div>

    <div>
      <div class="face" id="L"></div>
      <div class="label">Left</div>
    </div>
    <div>
      <div class="face" id="F"></div>
      <div class="label">Front</div>
    </div>
    <div>
      <div class="face" id="R"></div>
      <div class="label">Right</div>
    </div>
    <div>
      <div class="face" id="B"></div>
      <div class="label">Back</div>
    </div>

    <div></div>
    <div>
      <div class="face" id="D"></div>
      <div class="label">Down</div>
    </div>
    <div></div>
    <div></div>
  </div>

  <script>
    // Cube class to handle faces and rotations
    class Cube {
      constructor() {
        // Initialize each face with a single color
        this.faces = {
          U: Array(9).fill('w'), // Up = white
          D: Array(9).fill('y'), // Down = yellow
          F: Array(9).fill('g'), // Front = green
          B: Array(9).fill('b'), // Back = blue
          L: Array(9).fill('o'), // Left = orange
          R: Array(9).fill('r')  // Right = red
        };
      }

      // Rotate a single face clockwise
      rotateFace(face) {
        let f = this.faces[face];
        this.faces[face] = [
          f[6], f[3], f[0],
          f[7], f[4], f[1],
          f[8], f[5], f[2]
        ];
      }

      // Rotate a face and update surrounding edges
      rotateFaceWithSides(face) {
        this.rotateFace(face); // rotate main face
        let f = this.faces;
        const copy = arr => [...arr];

        // Switch case for each face rotation affecting adjacent faces
        switch(face) {
          case 'U':
            [f.F,f.R,f.B,f.L]=[copy(f.F),copy(f.R),copy(f.B),copy(f.L)];
            [f.F[0],f.F[1],f.F[2],f.R[0],f.R[1],f.R[2],f.B[0],f.B[1],f.B[2],f.L[0],f.L[1],f.L[2]] =
            [f.R[0],f.R[1],f.R[2],f.B[0],f.B[1],f.B[2],f.L[0],f.L[1],f.L[2],f.F[0],f.F[1],f.F[2]];
            break;
          case 'D':
            [f.F,f.R,f.B,f.L]=[copy(f.F),copy(f.R),copy(f.B),copy(f.L)];
            [f.F[6],f.F[7],f.F[8],f.R[6],f.R[7],f.R[8],f.B[6],f.B[7],f.B[8],f.L[6],f.L[7],f.L[8]] =
            [f.L[6],f.L[7],f.L[8],f.F[6],f.F[7],f.F[8],f.R[6],f.R[7],f.R[8],f.B[6],f.B[7],f.B[8]];
            break;
          case 'F':
            [f.U,f.R,f.D,f.L]=[copy(f.U),copy(f.R),copy(f.D),copy(f.L)];
            [f.U[6],f.U[7],f.U[8],f.R[0],f.R[3],f.R[6],f.D[2],f.D[1],f.D[0],f.L[8],f.L[5],f.L[2]] =
            [f.L[8],f.L[5],f.L[2],f.U[6],f.U[7],f.U[8],f.R[0],f.R[3],f.R[6],f.D[2],f.D[1],f.D[0]];
            break;
          case 'B':
            [f.U,f.R,f.D,f.L]=[copy(f.U),copy(f.R),copy(f.D),copy(f.L)];
            [f.U[0],f.U[1],f.U[2],f.L[0],f.L[3],f.L[6],f.D[8],f.D[7],f.D[6],f.R[8],f.R[5],f.R[2]] =
            [f.R[8],f.R[5],f.R[2],f.U[0],f.U[1],f.U[2],f.L[0],f.L[3],f.L[6],f.D[8],f.D[7],f.D[6]];
            break;
          case 'L':
            [f.U,f.F,f.D,f.B]=[copy(f.U),copy(f.F),copy(f.D),copy(f.B)];
            [f.U[0],f.U[3],f.U[6],f.F[0],f.F[3],f.F[6],f.D[0],f.D[3],f.D[6],f.B[8],f.B[5],f.B[2]] =
            [f.B[8],f.B[5],f.B[2],f.U[0],f.U[3],f.U[6],f.F[0],f.F[3],f.F[6],f.D[0],f.D[3],f.D[6]];
            break;
          case 'R':
            [f.U,f.F,f.D,f.B]=[copy(f.U),copy(f.F),copy(f.D),copy(f.B)];
            [f.U[2],f.U[5],f.U[8],f.B[6],f.B[3],f.B[0],f.D[2],f.D[5],f.D[8],f.F[2],f.F[5],f.F[8]] =
            [f.F[2],f.F[5],f.F[8],f.U[2],f.U[5],f.U[8],f.B[6],f.B[3],f.B[0],f.D[2],f.D[5],f.D[8]];
            break;
        }
      }
    }

    let cube = new Cube();
    let scrambleMoves = []; // keep track of all moves for proper solve

    const colorMap = { w:'white', y:'yellow', g:'green', b:'blue', o:'orange', r:'red' };

    // Render the cube faces in HTML
    function renderCube() {
      for(let face of ['U','D','F','B','L','R']){
        const container = document.getElementById(face);
        container.innerHTML = '';
        for(let color of cube.faces[face]){
          const tile = document.createElement('div');
          tile.className='tile';
          tile.style.backgroundColor=colorMap[color];
          container.appendChild(tile);
        }
      }
    }

    // Manual rotation via buttons
    function rotate(face) {
      cube.rotateFaceWithSides(face);
      scrambleMoves.push(face); // record the move
      renderCube();
      document.getElementById('status').innerText = `Rotated: ${face}`;
    }

    // Randomly scramble the cube and record all moves
    function scrambleCube() {
      let faces=['U','D','F','B','L','R'];
      for(let i=0;i<10;i++){
        let move=faces[Math.floor(Math.random()*faces.length)];
        cube.rotateFaceWithSides(move);
        scrambleMoves.push(move);
      }
      renderCube();
      document.getElementById('status').innerText = `Scrambled: ${scrambleMoves.join(', ')}`;
    }

    // Solve the cube by reversing all scramble moves
    function solveCube() {
      if(scrambleMoves.length===0){
        document.getElementById('status').innerText='Nothing to solve!';
        return;
      }
      let reverseMoves = scrambleMoves.slice().reverse();
      let i=0;
      document.getElementById('status').innerText='Solving...';

      let interval = setInterval(()=>{
        if(i>=reverseMoves.length){
          clearInterval(interval);
          document.getElementById('status').innerText='Cube Solved!';
          scrambleMoves=[]; // reset history after solving
          return;
        }
        let move=reverseMoves[i];
        for(let j=0;j<3;j++){
          cube.rotateFaceWithSides(move); // 3 clockwise = counter-clockwise
        }
        renderCube();
        i++;
      },600);
    }

    renderCube(); // initial render
  </script>
</body>
</html>
